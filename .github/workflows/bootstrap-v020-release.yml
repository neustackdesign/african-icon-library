name: Bootstrap V0.2.0 Release

# One-shot release bridge. The connector can write repository contents but
# cannot create Git tags/releases directly, so this workflow performs the
# already-approved V0.2.0 publication inside GitHub Actions. Delete after run.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v020-release.yml'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish V0.2.0 and create release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: v0.2.0
      VERSION: 0.2.0
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release_commit
        shell: bash
        run: |
          set -euo pipefail
          # The workflow was introduced by the triggering commit. Tag its parent
          # so V0.2.0 points at the prepared public-release source, not this
          # temporary operational workflow.
          release_sha="$(git rev-parse HEAD^)"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Release SHA: $release_sha"
          git checkout --detach "$release_sha"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Full release check
        run: |
          npm run check
          npm run verify:packages

      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail
          for pkg in metadata icons react; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            test "$version" = "$VERSION" || {
              echo "::error::packages/$pkg is $version; expected $VERSION"
              exit 1
            }
          done

      - name: Build and verify release artefacts
        run: |
          npm run release:build
          npm run package:plugins
          npm run release:verify
          npm run release:notes

      - name: Check npm first-publish requirements
        id: npm_preflight
        shell: bash
        run: |
          set -euo pipefail
          first_publish=false
          for pkg in metadata icons react; do
            if npm view "@african-icon-library/$pkg" name >/dev/null 2>&1; then
              echo "@african-icon-library/$pkg already exists on npm"
            else
              echo "@african-icon-library/$pkg is a first publish"
              first_publish=true
            fi
          done
          echo "first_publish=$first_publish" >> "$GITHUB_OUTPUT"
          if [ "$first_publish" = "true" ] && [ "$HAS_NPM_TOKEN" != "true" ]; then
            echo "::error::At least one package is a first publish, but repository secret NPM_TOKEN is not configured."
            exit 1
          fi

      - name: Use npm with trusted publishing support
        run: npm install -g npm@11

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for pkg in metadata icons react; do
            name="@african-icon-library/$pkg"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already published — skipping"
            else
              echo "::group::publish $name@$VERSION"
              npm publish -w "$name" --access public --provenance
              echo "::endgroup::"
            fi
          done

      - name: Create or verify release tag
        env:
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "$TAG")"
            test "$existing" = "$RELEASE_SHA" || {
              echo "::error::$TAG exists at $existing, expected $RELEASE_SHA"
              exit 1
            }
            echo "$TAG already points at the intended release commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$RELEASE_SHA" -m "African Icon Library $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "African Icon Library $TAG" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "African Icon Library $TAG" --notes-file release/RELEASE_NOTES.md --verify-tag
          fi
          gh release upload "$TAG" --clobber release/*.zip release/*.json release/figma/*.zip
          gh release view "$TAG" --json url,tagName,name,assets
