name: Release

# Publishes the three packages to npm and attaches the release artefacts.
#
# This exists so publishing never depends on a token passing through a person's
# hands. Two routes are supported, in order of preference:
#
#   1. Trusted publishing (OIDC). No secret at all: npm verifies the workflow's
#      identity directly. Configure it per package on npmjs.com under
#      Settings -> Trusted publishers, pointing at this repository and this
#      workflow file. npm requires the package to exist before a trusted
#      publisher can be attached, so this route is available from the second
#      publish onward.
#
#   2. A granular access token in the NPM_TOKEN repository secret. Needed for
#      the very first publish of a brand-new package name. Set it in
#      Settings -> Secrets and variables -> Actions. It never leaves GitHub.
#
# The workflow picks route 1 whenever NPM_TOKEN is absent, so deleting the
# secret after the first release is the intended end state.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub release and attach artefacts
  id-token: write # required for npm trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish packages and create the release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Deliberately installs with the npm that produced the lockfile. npm 12
      # tightened its optional-dependency check and rejects a lockfile written
      # by npm 10 with "Missing: @esbuild/... from lock file", so the upgrade
      # for trusted publishing happens after this step, not before it.
      - name: Install
        run: npm ci

      # The same gate as CI. A tag must never publish something that would have
      # failed on main.
      - name: Full check
        run: npm run check

      - name: Verify publishable packages
        run: npm run verify:packages

      # The tag and the package versions must agree, or the release notes and
      # the registry disagree forever after.
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in metadata icons react; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::packages/$pkg is $version but the tag is $tag"
              exit 1
            fi
          done
          echo "all three packages are $tag"

      # `npm run check` already builds these, but rebuilding here makes the
      # artefacts that get attached unambiguously the ones this run produced.
      - name: Rebuild release artefacts
        run: |
          npm run release:build
          npm run package:plugins

      # Recomputes every published SHA-256 from the bytes on disk. A checksum
      # nothing verifies is decoration; this refuses to attach one it has not
      # just confirmed, and fails on any artefact shipping without one.
      - name: Verify artefact checksums
        run: npm run release:verify

      # Composed from repository state and the changelog, so the release page
      # cannot claim a count, a weight or a channel the library does not have.
      - name: Generate release notes
        run: |
          npm run release:notes
          echo "::group::release notes"
          cat release/RELEASE_NOTES.md
          echo "::endgroup::"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10. Pinned to
      # the 11 line rather than `latest`, so a future npm major cannot change
      # publish behaviour underneath a release without someone choosing it.
      - name: Use an npm that supports trusted publishing
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          npm install -g npm@11
          echo "npm $(npm -v)"

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          # Empty when the secret is unset, which is the signal to use OIDC.
          # setup-node writes a placeholder into .npmrc, so the presence of the
          # secret is checked here rather than by inspecting the environment.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "NPM_TOKEN present — publishing with the granular token."
          else
            echo "No NPM_TOKEN set — publishing via trusted publishing (OIDC)."
          fi
          # Dependency order: icons depends on metadata by exact version, and
          # react depends on both. Publishing out of order leaves a window where
          # an installed package cannot resolve its own dependency.
          for pkg in metadata icons react; do
            echo "::group::publish @african-icon-library/$pkg"
            npm publish -w "@african-icon-library/$pkg" --access public --provenance
            echo "::endgroup::"
          done

      # Release creation runs here rather than being handed to a person: the
      # runner's GITHUB_TOKEN can reach the Releases API even when a local
      # session cannot. Same reasoning as publishing npm from CI.
      - name: Create the GitHub release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Idempotent: a re-run of the same tag updates the release rather than
          # failing outright, so a transient npm error does not strand the tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists — updating notes and re-uploading artefacts"
            gh release edit "$tag" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$tag" \
              --title "African Icon Library $tag" \
              --notes-file release/RELEASE_NOTES.md \
              --verify-tag
          fi
          # --clobber so a re-run replaces an asset rather than erroring on it.
          gh release upload "$tag" --clobber \
            release/*.zip \
            release/*.json \
            release/figma/*.zip
          echo "attached:"
          gh release view "$tag" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'

      # Proves every step above except the two that leave the runner: the npm
      # publish and the release creation.
      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Artefacts that a tagged run would attach:"
          ls -1 release/*.zip release/*.json release/figma/*.zip | sed 's|^|  |'
          echo
          echo "Packing the three packages:"
          for pkg in metadata icons react; do
            npm pack -w "@african-icon-library/$pkg" --pack-destination /tmp
          done
          ls -l /tmp/*.tgz

      - name: Upload release artefacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            release/
            media/
            qa/
          if-no-files-found: error
          retention-days: 90
