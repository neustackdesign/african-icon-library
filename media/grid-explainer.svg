<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FAF9F6"/><text x="140" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#16150F" text-anchor="start">One grid, every icon</text><text x="140" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#56524A" text-anchor="start">24-unit canvas · 2-unit live area · 1.5 stroke · round caps and joins</text><line x1="140" y1="220" x2="140" y2="740" stroke="#E2DED3" stroke-width="2"/><line x1="140" y1="220" x2="660" y2="220" stroke="#E2DED3" stroke-width="2"/><line x1="161.66666666666666" y1="220" x2="161.66666666666666" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="241.66666666666666" x2="660" y2="241.66666666666666" stroke="#E2DED3" stroke-width="1"/><line x1="183.33333333333334" y1="220" x2="183.33333333333334" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="263.3333333333333" x2="660" y2="263.3333333333333" stroke="#E2DED3" stroke-width="1"/><line x1="205" y1="220" x2="205" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="285" x2="660" y2="285" stroke="#E2DED3" stroke-width="1"/><line x1="226.66666666666669" y1="220" x2="226.66666666666669" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="306.6666666666667" x2="660" y2="306.6666666666667" stroke="#E2DED3" stroke-width="1"/><line x1="248.33333333333334" y1="220" x2="248.33333333333334" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="328.33333333333337" x2="660" y2="328.33333333333337" stroke="#E2DED3" stroke-width="1"/><line x1="270" y1="220" x2="270" y2="740" stroke="#E2DED3" stroke-width="2"/><line x1="140" y1="350" x2="660" y2="350" stroke="#E2DED3" stroke-width="2"/><line x1="291.6666666666667" y1="220" x2="291.6666666666667" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="371.6666666666667" x2="660" y2="371.6666666666667" stroke="#E2DED3" stroke-width="1"/><line x1="313.33333333333337" y1="220" x2="313.33333333333337" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="393.33333333333337" x2="660" y2="393.33333333333337" stroke="#E2DED3" stroke-width="1"/><line x1="335" y1="220" x2="335" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="415" x2="660" y2="415" stroke="#E2DED3" stroke-width="1"/><line x1="356.6666666666667" y1="220" x2="356.6666666666667" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="436.6666666666667" x2="660" y2="436.6666666666667" stroke="#E2DED3" stroke-width="1"/><line x1="378.33333333333337" y1="220" x2="378.33333333333337" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="458.33333333333337" x2="660" y2="458.33333333333337" stroke="#E2DED3" stroke-width="1"/><line x1="400" y1="220" x2="400" y2="740" stroke="#E2DED3" stroke-width="2"/><line x1="140" y1="480" x2="660" y2="480" stroke="#E2DED3" stroke-width="2"/><line x1="421.6666666666667" y1="220" x2="421.6666666666667" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="501.6666666666667" x2="660" y2="501.6666666666667" stroke="#E2DED3" stroke-width="1"/><line x1="443.33333333333337" y1="220" x2="443.33333333333337" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="523.3333333333334" x2="660" y2="523.3333333333334" stroke="#E2DED3" stroke-width="1"/><line x1="465" y1="220" x2="465" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="545" x2="660" y2="545" stroke="#E2DED3" stroke-width="1"/><line x1="486.6666666666667" y1="220" x2="486.6666666666667" y2="740" stroke="#E2DED3" stroke-width="1"/><line x1="140" y1="566.6666666666667" x2="660" y2="566.6666666666667" stroke="#E2DED3" stroke-width="1"/><line x1="508.33333333333337" y1="220" x2="508.33333333333337" y2="740" stroke="#E2DED