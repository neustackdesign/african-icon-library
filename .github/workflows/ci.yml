name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, validate, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Every icon asset must already be in canonical optimised form. A drifted
      # asset means the source of truth and the shipped file disagree.
      - name: Check asset optimisation
        run: npm run optimize -- --check

      - name: Validate icons and metadata
        run: npm run validate

      # Generated code is committed so `npm install && npm run build` needs no
      # hidden step. This proves it still matches its inputs.
      - name: Verify generated output
        run: npm run verify:generated

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Packs the publishable packages and installs them into a throwaway
      # consumer. `files`, `exports` and type resolution all look correct in the
      # repository and break the moment someone installs the tarball.
      - name: Verify publishable packages
        run: npm run verify:packages

      - name: Upload release artefacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artefacts
          path: |
            release/
            media/
            qa/
          if-no-files-found: error
          retention-days: 30
