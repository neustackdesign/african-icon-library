name: Dependency review

# A pull request that adds a dependency is the most likely way something unwanted enters the
# published packages or the plugin bundle. This reads the diff of the lockfile before it merges.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # The whole project is MIT and stays that way. A copyleft or unclear licence entering
          # the tree is a licensing problem for everyone who redistributes the assets.
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later, LGPL-2.0-or-later, LGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure
