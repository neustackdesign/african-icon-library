<path d="m9.3 7 1.3 10m4.1-10-1.3 10M12 7.25V17"/></g><text x="140" y="786" font-family="ui-monospace, SFMono-Regular, Menlo, 'IBM Plex Mono', monospace" font-size="20" font-weight="400" fill="#56524A" text-anchor="start">talking-drum</text><text x="800" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#16150F" text-anchor="start">24 × 24 canvas</text><text x="800" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#56524A" text-anchor="start">The coordinate contract. Every asset, no exceptions.</text><text x="800" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#16150F" text-anchor="start">2-unit live area</text><text x="800" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#56524A" text-anchor="start">Nothing crosses it, so icons sit optically level side by side.</text><text x="800" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#16150F" text-anchor="start">1.5 stroke</text><text x="800" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#56524A" text-anchor="start">Round caps and joins throughout. Minimum 1.5 counter between strokes.</text><text x="800" y="556" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#16150F" text-anchor="start">currentColor</text><text x="800" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#56524A" text-anchor="start">No hard-coded colour anywhere. Recolour with `color`.</text><text x="800" y="648" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#16150F" text-anchor="start">No letterforms</text><text x="800" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Schibsted Grotesk', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#56524A" text-anchor="start">Type is illegible at icon size and cannot be localised.</text></svg>
