name: Format Figma release files

on:
  push:
    branches:
      - feat/figma-community-plugin-v3

permissions:
  contents: write

jobs:
  prettier:
    if: ${{ !contains(github.event.head_commit.message, '[format-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/figma-community-plugin-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier config
        run: |
          npx prettier --write \
            apps/figma-community-builder/src/copy.ts \
            apps/figma-plugin/src/ui.css \
            apps/figma-plugin/src/ui.ts \
            docs/figma-community-v3-design-direction.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/figma-community-builder/src/copy.ts \
            apps/figma-plugin/src/ui.css \
            apps/figma-plugin/src/ui.ts \
            docs/figma-community-v3-design-direction.md
          git commit -m "chore: format Figma release files [format-skip]"
          git push origin HEAD:feat/figma-community-plugin-v3
